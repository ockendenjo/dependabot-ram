name: Build

on:
  workflow_call: { }

permissions: {}

jobs:
  build:
    name: build
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install xc
        run: go install github.com/joerdav/xc/cmd/xc@88e96f66e491b66a71a6660b4560f4b10a7c59e5 # v0.9.0

      - name: Run script
        run: |
          xc build
