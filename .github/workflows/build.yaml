name: Build

on:
  workflow_call: { }

permissions: {}

jobs:
  build:
    name: build
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install xc
        run: go install github.com/joerdav/xc/cmd/xc@88e96f66e491b66a71a6660b4560f4b10a7c59e5 # v0.9.0

      - name: Run script
        run: |
          xc build
